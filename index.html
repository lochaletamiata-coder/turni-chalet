<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turni Chalet">
<title>Turni · Lo Chalet Amiata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─── RESET & BASE ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown-deep:  #2C1A0E;
  --brown-dark:  #3B2A1A;
  --brown-mid:   #5C4033;
  --brown-light: #8B6347;
  --cream:       #F7F4EF;
  --cream-dark:  #EDE0CC;
  --gold:        #C8973A;
  --gold-light:  #F5E6C8;
  --green:       #5A7A52;
  --green-light: #D5E8D4;
  --bordeaux:    #8B2635;
  --bordeaux-light:#FDEAEA;
  --orange-light:#FFE6CC;
  --blue-light:  #DAE8FC;
  --text-dark:   #2C1A0E;
  --text-mid:    #6B5040;
  --text-light:  #A08B78;
  --white:       #FFFFFF;
  --shadow-sm: 0 2px 8px rgba(44,26,14,.10);
  --shadow-md: 0 4px 20px rgba(44,26,14,.15);
  --shadow-lg: 0 8px 40px rgba(44,26,14,.20);
  --radius: 14px;
  --radius-sm: 8px;
}
html{height:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--text-dark);
  min-height:100%;
  overflow-x:hidden;
}

/* ─── HEADER ───────────────────────────────────────────────────────────────── */
.app-header{
  background:var(--brown-deep);
  color:var(--gold-light);
  padding:16px 20px 14px;
  position:sticky;top:0;z-index:100;
  box-shadow:var(--shadow-md);
}
.header-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:36px;height:36px;border-radius:50%;
  background:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.logo-text{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;letter-spacing:.3px}
.logo-sub{font-size:10px;color:var(--text-light);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.btn-admin{
  background:none;border:1.5px solid rgba(200,151,58,.4);
  color:var(--gold-light);padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .2s;letter-spacing:.5px;
}
.btn-admin:hover,.btn-admin.active{background:var(--gold);border-color:var(--gold);color:var(--brown-deep)}

/* Week nav */
.week-nav{
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.06);border-radius:10px;padding:8px 14px;
}
.week-label{
  font-family:'Playfair Display',serif;font-size:15px;font-weight:500;
  color:var(--gold-light);text-align:center;flex:1;
}
.week-label span{display:block;font-family:'DM Sans',sans-serif;font-size:11px;
  color:var(--text-light);font-weight:400;margin-top:1px;letter-spacing:.5px}
.btn-week{
  background:none;border:none;color:var(--gold);font-size:20px;
  cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s;
  line-height:1;
}
.btn-week:hover{background:rgba(200,151,58,.15)}

/* ─── MAIN ─────────────────────────────────────────────────────────────────── */
.main{padding:16px;max-width:640px;margin:0 auto}

/* ─── DAY CARD ─────────────────────────────────────────────────────────────── */
.day-card{
  background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden;
  border:1px solid rgba(91,64,51,.08);
  transition:box-shadow .2s;
}
.day-card:hover{box-shadow:var(--shadow-md)}

.day-header{
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none;
}
.day-header.feriale{background:var(--brown-mid)}
.day-header.weekend{background:var(--bordeaux)}
.day-name{
  font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--white);
}
.day-date{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px;letter-spacing:.3px}
.day-badge{
  font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;
}
.day-badge.feriale{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7)}
.day-badge.weekend{background:rgba(255,232,192,.2);color:#FFE8C0}
.day-chevron{color:rgba(255,255,255,.5);font-size:14px;margin-left:8px;transition:transform .25s}
.day-card.open .day-chevron{transform:rotate(180deg)}

.day-body{display:none;padding:0 12px 12px}
.day-card.open .day-body{display:block}

/* Annotazioni */
.annotazioni-wrap{margin-top:10px}
.annotazioni-label{
  font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-light);margin-bottom:4px;
}
.annotazioni-box{
  background:#FFF8E7;border:1.5px solid #E8C96A;border-radius:var(--radius-sm);
  padding:8px 12px;min-height:34px;font-size:13px;color:var(--text-mid);
  cursor:text;transition:border-color .2s;
}
.annotazioni-box:focus-within{border-color:var(--gold)}
.annotazioni-input{
  width:100%;border:none;background:transparent;font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--text-dark);outline:none;resize:none;
  min-height:20px;
}
.annotazioni-placeholder{color:var(--text-light);font-style:italic;font-size:13px}

/* ─── FASCIA ───────────────────────────────────────────────────────────────── */
.fascia{margin-top:10px}
.fascia-header{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--green);border-radius:var(--radius-sm);margin-bottom:6px;
}
.fascia-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
.fascia-name{
  font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--white);
}
.fascia-count{
  margin-left:auto;font-size:10px;color:rgba(255,255,255,.6);font-weight:500;
}

/* ─── TURNO ROW ────────────────────────────────────────────────────────────── */
.turno-row{
  display:grid;grid-template-columns:1fr 80px 80px 90px;
  gap:4px;margin-bottom:4px;align-items:center;
}
.turno-row.view-mode{
  background:var(--cream);border-radius:var(--radius-sm);
  padding:6px 8px;border:1px solid transparent;
}
.turno-row.view-mode:hover{border-color:var(--cream-dark)}
.turno-row.empty-view{opacity:.35}

.cell-nome{font-size:13px;font-weight:600;color:var(--text-dark);truncate:true;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell-orario{
  font-size:12px;font-weight:500;text-align:center;padding:3px 6px;
  border-radius:6px;white-space:nowrap;
}
.cell-entrata{background:var(--green-light);color:#3A6B34}
.cell-uscita{background:var(--orange-light);color:#B06020}
.cell-mansione{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  text-align:center;padding:3px 6px;border-radius:6px;
  background:var(--blue-light);color:#2A5A8B;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cell-empty{font-size:11px;color:var(--text-light);text-align:center}

/* Admin inputs */
.cell-input{
  width:100%;border:1.5px solid var(--cream-dark);border-radius:6px;
  padding:5px 7px;font-family:'DM Sans',sans-serif;font-size:12px;
  color:var(--text-dark);background:var(--white);outline:none;
  transition:border-color .15s;appearance:none;-webkit-appearance:none;
}
.cell-input:focus{border-color:var(--gold)}
.cell-input.inp-nome{background:var(--cream-dark)}
.cell-input.inp-entrata{background:var(--green-light)}
.cell-input.inp-uscita{background:var(--orange-light)}
.cell-input.inp-mansione{background:var(--blue-light)}

/* ─── ADMIN PANEL ──────────────────────────────────────────────────────────── */
.admin-login{
  position:fixed;inset:0;background:rgba(44,26,14,.85);
  display:flex;align-items:center;justify-content:center;
  z-index:200;backdrop-filter:blur(4px);
}
.login-card{
  background:var(--white);border-radius:20px;padding:32px 28px;
  width:min(340px,90vw);box-shadow:var(--shadow-lg);
}
.login-title{
  font-family:'Playfair Display',serif;font-size:22px;color:var(--brown-deep);
  margin-bottom:6px;
}
.login-sub{font-size:13px;color:var(--text-light);margin-bottom:24px}
.login-input{
  width:100%;border:2px solid var(--cream-dark);border-radius:10px;
  padding:12px 16px;font-size:16px;font-family:'DM Sans',sans-serif;
  color:var(--text-dark);outline:none;transition:border-color .2s;
  margin-bottom:16px;
}
.login-input:focus{border-color:var(--gold)}
.login-btn{
  width:100%;background:var(--brown-deep);color:var(--gold-light);
  border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:background .2s;
}
.login-btn:hover{background:var(--brown-mid)}
.login-err{color:var(--bordeaux);font-size:13px;margin-top:-8px;margin-bottom:12px;display:none}

/* ─── SAVE BAR ─────────────────────────────────────────────────────────────── */
.save-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--brown-deep);padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 -4px 20px rgba(44,26,14,.25);z-index:100;
  transform:translateY(100%);transition:transform .3s;
}
.save-bar.visible{transform:translateY(0)}
.save-status{font-size:13px;color:var(--gold-light)}
.btn-save{
  background:var(--gold);color:var(--brown-deep);border:none;
  padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;
}
.btn-save:hover{background:var(--gold-light)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* ─── LOADING ──────────────────────────────────────────────────────────────── */
.loading-screen{
  position:fixed;inset:0;background:var(--brown-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:300;transition:opacity .4s;
}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold-light);margin-bottom:8px}
.loading-sub{font-size:13px;color:var(--text-light);margin-bottom:32px;letter-spacing:.5px}
.spinner{
  width:32px;height:32px;border:3px solid rgba(200,151,58,.2);
  border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TOAST ────────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--brown-deep);color:var(--gold-light);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;
  opacity:0;transition:all .3s;z-index:400;white-space:nowrap;
  box-shadow:var(--shadow-md);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─── EMPTY STATE ──────────────────────────────────────────────────────────── */
.empty-week{text-align:center;padding:48px 20px;color:var(--text-light)}
.empty-week .icon{font-size:40px;margin-bottom:12px}
.empty-week p{font-size:14px;line-height:1.6}

/* ─── RESPONSIVE ───────────────────────────────────────────────────────────── */
@media(max-width:420px){
  .turno-row{grid-template-columns:1fr 70px 70px 80px;gap:3px}
  .cell-orario{font-size:11px;padding:2px 4px}
  .cell-mansione{font-size:9px;padding:2px 4px}
}

/* ─── COL HEADERS ROW ──────────────────────────────────────────────────────── */
.turno-col-headers{
  display:grid;grid-template-columns:1fr 80px 80px 90px;
  gap:4px;padding:0 0 4px;margin-bottom:2px;
  border-bottom:1px solid var(--cream-dark);
}
.col-h{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--text-light);text-align:center;}
.col-h:first-child{text-align:left}
@media(max-width:420px){
  .turno-col-headers{grid-template-columns:1fr 70px 70px 80px;gap:3px}
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">Lo Chalet Amiata</div>
  <div class="loading-sub">Caricamento turni...</div>
  <div class="spinner"></div>
</div>

<!-- ADMIN LOGIN -->
<div class="admin-login" id="adminLogin" style="display:none">
  <div class="login-card">
    <div class="login-title">Accesso Admin</div>
    <div class="login-sub">Inserisci la password per modificare i turni</div>
    <input type="password" class="login-input" id="loginInput" placeholder="Password" autocomplete="off">
    <div class="login-err" id="loginErr">Password errata. Riprova.</div>
    <button class="login-btn" onclick="doLogin()">Entra</button>
  </div>
</div>

<!-- HEADER -->
<header class="app-header">
  <div class="header-top">
    <div class="logo-wrap">
      <div class="logo-icon">🏔</div>
      <div>
        <div class="logo-text">Lo Chalet Amiata</div>
        <div class="logo-sub">Turni Staff</div>
      </div>
    </div>
    <button class="btn-admin" id="btnAdmin" onclick="toggleAdmin()">Admin</button>
  </div>
  <div class="week-nav">
    <button class="btn-week" onclick="changeWeek(-1)">‹</button>
    <div class="week-label" id="weekLabel">
      —<span id="weekRange">caricamento...</span>
    </div>
    <button class="btn-week" onclick="changeWeek(1)">›</button>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="mainContent"></main>

<!-- SAVE BAR -->
<div class="save-bar" id="saveBar">
  <div class="save-status" id="saveStatus">Modifiche non salvate</div>
  <button class="btn-save" id="btnSave" onclick="saveTurni()">Salva</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwpNH-IylmM06Ziz8h34gFzRknuDB7AXPG1ZeF2OC1Z8ssDcAGHn7gqiKgwUYShW9Ue2w/exec'; // sostituire dopo il deploy
const ADMIN_PASSWORD  = 'chalet2026';

const STAFF = ['VALERIO','CONCETTA','SERENA','ANNA','JERRY','EMILIO',
               'FRANCY','ANDREA','SIMONE','ZOE','MARGHERITA','MICHELA',
               'GIULIA F.','TOMMY C.','GIADA'];

const MANSIONI = ['SALA','CUCINA','BAR','CASSA','APERTURA','DIR.'];

const ORARI = [];
for(let h=8;h<=24;h++){
  for(let m of[0,30]){
    if(h===24&&m===30) break;
    ORARI.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
  }
}

const FASCE = [
  {nome:'APERTURA',           righe:4},
  {nome:'PRANZO / SELF SERVICE', righe:7},
  {nome:'POMERIGGIO',         righe:7},
  {nome:'CENA',               righe:7},
];

const GIORNI = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MESI   = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];

// ─── STATE ───────────────────────────────────────────────────────────────────
let isAdmin    = false;
let weekOffset = 0;   // 0 = settimana corrente
let turniData  = {};  // { 'YYYY-MM-DD': { fasce:{...}, annotazioni:'' } }
let dirty      = false;
let currentWeekDays = [];

// ─── UTILS ───────────────────────────────────────────────────────────────────
function getMonday(d){
  const dt=new Date(d);
  const day=dt.getDay();
  const diff=dt.getDate()-(day===0?6:day-1);
  dt.setDate(diff);dt.setHours(0,0,0,0);
  return dt;
}
function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt}
function dateKey(d){return d.toISOString().split('T')[0]}
function fmtDate(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
function isWeekend(d){return d.getDay()===0||d.getDay()>=5}

function showToast(msg,dur=2500){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),dur);
}

// ─── WEEK NAVIGATION ─────────────────────────────────────────────────────────
function getCurrentWeekDays(){
  const monday=getMonday(addDays(new Date(),weekOffset*7));
  return Array.from({length:7},(_,i)=>addDays(monday,i));
}

function updateWeekHeader(){
  const days=currentWeekDays;
  const start=days[0],end=days[6];
  document.getElementById('weekLabel').childNodes[0].textContent=
    `${GIORNI[0].substring(0,3)} ${fmtDate(start)} – Dom ${fmtDate(end)}`;
  document.getElementById('weekRange').textContent=
    `${MESI[start.getMonth()]} ${start.getFullYear()}`;
}

function changeWeek(dir){
  weekOffset+=dir;
  currentWeekDays=getCurrentWeekDays();
  updateWeekHeader();
  renderWeek();
  if(APPS_SCRIPT_URL!=='YOUR_APPS_SCRIPT_URL') loadTurni();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function emptyDay(){
  // Struttura vuota per un giorno
  const fasce={};
  FASCE.forEach(f=>{
    fasce[f.nome]=Array.from({length:f.righe},()=>({nome:'',entrata:'',uscita:'',mansione:''}));
  });
  return {fasce, annotazioni:''};
}

function renderWeek(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';

  currentWeekDays.forEach((d,idx)=>{
    const key=dateKey(d);
    if(!turniData[key]) turniData[key]=emptyDay();
    const dayData=turniData[key];
    const we=isWeekend(d);

    const card=document.createElement('div');
    card.className='day-card';
    card.dataset.key=key;

    // Apri domenica e sabato di default, lunedì della settimana corrente
    if(we||weekOffset===0&&idx===0) card.classList.add('open');

    // Header
    const hdr=document.createElement('div');
    hdr.className=`day-header ${we?'weekend':'feriale'}`;
    hdr.innerHTML=`
      <div>
        <div class="day-name">${we?'★ ':''}${GIORNI[d.getDay()===0?6:d.getDay()-1]}</div>
        <div class="day-date">${fmtDate(d)} ${d.getFullYear()}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="day-badge ${we?'weekend':'feriale'}">${we?'WEEKEND':'FERIALE'}</span>
        <span class="day-chevron">▾</span>
      </div>`;
    hdr.onclick=()=>{card.classList.toggle('open')};

    // Body
    const body=document.createElement('div');
    body.className='day-body';

    FASCE.forEach(fascia=>{
      const rows=dayData.fasce[fascia.nome]||
        Array.from({length:fascia.righe},()=>({nome:'',entrata:'',uscita:'',mansione:''}));

      // Conta presenti
      const presenti=rows.filter(r=>r.nome).length;

      const fDiv=document.createElement('div');
      fDiv.className='fascia';
      fDiv.innerHTML=`
        <div class="fascia-header">
          <div class="fascia-dot"></div>
          <div class="fascia-name">${fascia.nome}</div>
          <div class="fascia-count">${presenti>0?presenti+' pers.':''}</div>
        </div>`;

      // Col headers
      const colHdr=document.createElement('div');
      colHdr.className='turno-col-headers';
      colHdr.innerHTML=`<div class="col-h">Nome</div><div class="col-h">Entrata</div><div class="col-h">Uscita</div><div class="col-h">Mansione</div>`;
      fDiv.appendChild(colHdr);

      rows.forEach((r,ri)=>{
        const row=document.createElement('div');
        row.className=`turno-row ${isAdmin?'':'view-mode'} ${(!r.nome&&!isAdmin)?'empty-view':''}`;

        if(isAdmin){
          row.innerHTML=`
            ${makeSelect('nome',r.nome,STAFF,key,fascia.nome,ri,'inp-nome cell-input')}
            ${makeSelect('entrata',r.entrata,ORARI,key,fascia.nome,ri,'inp-entrata cell-input')}
            ${makeSelect('uscita',r.uscita,ORARI,key,fascia.nome,ri,'inp-uscita cell-input')}
            ${makeSelect('mansione',r.mansione,MANSIONI,key,fascia.nome,ri,'inp-mansione cell-input')}`;
        } else {
          if(!r.nome){
            row.innerHTML=`<div class="cell-nome cell-empty">—</div>
              <div class="cell-orario cell-empty">—</div>
              <div class="cell-orario cell-empty">—</div>
              <div class="cell-mansione cell-empty" style="background:transparent;color:var(--text-light)">—</div>`;
          } else {
            row.innerHTML=`
              <div class="cell-nome">${r.nome}</div>
              <div class="cell-orario cell-entrata">${r.entrata||'—'}</div>
              <div class="cell-orario cell-uscita">${r.uscita||'—'}</div>
              <div class="cell-mansione">${r.mansione||'—'}</div>`;
          }
        }
        fDiv.appendChild(row);
      });

      body.appendChild(fDiv);
    });

    // Annotazioni
    const annWrap=document.createElement('div');
    annWrap.className='annotazioni-wrap';
    if(isAdmin){
      annWrap.innerHTML=`
        <div class="annotazioni-label">📝 Annotazioni</div>
        <div class="annotazioni-box">
          <textarea class="annotazioni-input" rows="1"
            placeholder="Es: No Serena, No Francy, evento serale..."
            data-key="${key}"
            oninput="onAnnotazione(this)"
          >${dayData.annotazioni||''}</textarea>
        </div>`;
    } else if(dayData.annotazioni){
      annWrap.innerHTML=`
        <div class="annotazioni-label">📝 Annotazioni</div>
        <div class="annotazioni-box">
          <span style="font-size:13px;color:var(--text-mid)">${dayData.annotazioni}</span>
        </div>`;
    }
    body.appendChild(annWrap);

    card.appendChild(hdr);
    card.appendChild(body);
    main.appendChild(card);
  });

  // Padding bottom per save bar
  if(isAdmin){
    const spacer=document.createElement('div');
    spacer.style.height='80px';
    main.appendChild(spacer);
  }
}

function makeSelect(field,val,options,key,fascia,ri,cls){
  const id=`sel_${key}_${fascia}_${ri}_${field}`.replace(/[\/\s]/g,'_');
  let opts=`<option value="">—</option>`;
  options.forEach(o=>{opts+=`<option value="${o}"${o===val?' selected':''}>${o}</option>`});
  return `<select class="${cls}" id="${id}"
    onchange="onCellChange('${key}','${fascia}',${ri},'${field}',this.value)"
  >${opts}</select>`;
}

// ─── ADMIN ───────────────────────────────────────────────────────────────────
function toggleAdmin(){
  if(isAdmin){exitAdmin();return}
  document.getElementById('adminLogin').style.display='flex';
  setTimeout(()=>document.getElementById('loginInput').focus(),100);
}

document.getElementById('loginInput').addEventListener('keydown',e=>{
  if(e.key==='Enter') doLogin();
});

function doLogin(){
  const pw=document.getElementById('loginInput').value;
  if(pw===ADMIN_PASSWORD){
    isAdmin=true;
    document.getElementById('adminLogin').style.display='none';
    document.getElementById('loginInput').value='';
    document.getElementById('loginErr').style.display='none';
    document.getElementById('btnAdmin').classList.add('active');
    document.getElementById('btnAdmin').textContent='✓ Admin';
    renderWeek();
    showSaveBar();
    showToast('Modalità admin attiva');
  } else {
    document.getElementById('loginErr').style.display='block';
    document.getElementById('loginInput').value='';
    document.getElementById('loginInput').focus();
  }
}

function exitAdmin(){
  isAdmin=false;
  document.getElementById('btnAdmin').classList.remove('active');
  document.getElementById('btnAdmin').textContent='Admin';
  hideSaveBar();
  renderWeek();
  showToast('Modalità admin disattivata');
}

  if(!turniData[key]) turniData[key]=emptyDay();
  if(!turniData[key].fasce[fascia]) return;
  turniData[key].fasce[fascia][ri][field]=val;
  setDirty(true);
  // Aggiorna contatore presenti
  renderFasciaCount(key,fascia);
}

function onAnnotazione(el){
  const key=el.dataset.key;
  if(!turniData[key]) turniData[key]=emptyDay();
  turniData[key].annotazioni=el.value;

}

// ─── SAVE BAR ────────────────────────────────────────────────────────────────
function setDirty(v){
  dirty=v;
  document.getElementById('saveStatus').textContent=v?'Modifiche non salvate':'Tutto salvato ✓';
  document.getElementById('btnSave').disabled=!v;
}

function showSaveBar(){document.getElementById('saveBar').classList.add('visible')}
function hideSaveBar(){document.getElementById('saveBar').classList.remove('visible')}

// ─── JSONP HELPER (aggira CORS) ───────────────────────────────────────────────
function jsonpRequest(url, callbackName, timeout=20000){
  return new Promise((resolve, reject)=>{
    const script=document.createElement('script');
    let done=false;
    window[callbackName]=(data)=>{
      if(done) return; done=true;
      delete window[callbackName];
      try{document.body.removeChild(script);}catch(e){}
      resolve(data);
    };
    script.src=`${url}&callback=${callbackName}&t=${Date.now()}`;
    script.onerror=()=>{
      if(done) return; done=true;
      delete window[callbackName];
      try{document.body.removeChild(script);}catch(e){}
      reject(new Error('JSONP error'));
    };
    document.body.appendChild(script);
    setTimeout(()=>{
      if(done) return; done=true;
      delete window[callbackName];
      try{document.body.removeChild(script);}catch(e){}
      reject(new Error('Timeout'));
    }, timeout);
  });
}

// ─── GOOGLE SHEETS SYNC ───────────────────────────────────────────────────────
async function loadTurni(){
  try{
    const keys=currentWeekDays.map(dateKey);
    const url=`${APPS_SCRIPT_URL}?action=load&keys=${keys.join(',')}`;
    const json=await jsonpRequest(url,'_cbLoad'+Date.now(), 20000);
    if(json.data){
      Object.assign(turniData,json.data);
      renderWeek();
    }
  } catch(e){console.warn('Load error',e)}
}

async function saveTurni(){
  const btn=document.getElementById('btnSave');
  btn.disabled=true;btn.textContent='Salvataggio...';
  
  // Salva un giorno alla volta per evitare URL troppo lunghi
  try{
    const weekData={};
    currentWeekDays.forEach(d=>{
      const k=dateKey(d);
      if(turniData[k]) weekData[k]=turniData[k];
    });
    
    // Dividi in chunks da 2 giorni
    const keys=Object.keys(weekData);
    const chunks=[];
    for(let i=0;i<keys.length;i+=2){
      const chunk={};
      keys.slice(i,i+2).forEach(k=>chunk[k]=weekData[k]);
      chunks.push(chunk);
    }
    
    for(const chunk of chunks){
      const dataStr=JSON.stringify(chunk);
      const url=`${APPS_SCRIPT_URL}?action=save&data=${encodeURIComponent(dataStr)}`;
      await jsonpRequest(url,'_cbSave'+Date.now(), 25000);
    }
    
    setDirty(false);
    btn.textContent='Salva';
    showToast('✓ Turni salvati');
  } catch(e){
    btn.textContent='Salva';btn.disabled=false;
    showToast('Errore. Riprova tra qualche secondo.');
    console.error('Save error:',e);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init(){
  currentWeekDays=getCurrentWeekDays();
  updateWeekHeader();
  renderWeek();

  // Carica da Sheets se URL configurato
  if(APPS_SCRIPT_URL!=='YOUR_APPS_SCRIPT_URL'){
    loadTurni().finally(hideLoading);
  } else {
    setTimeout(hideLoading,600);
  }
}

function hideLoading(){
  const ls=document.getElementById('loadingScreen');
  ls.classList.add('hidden');
  setTimeout(()=>ls.style.display='none',400);
}

init();
